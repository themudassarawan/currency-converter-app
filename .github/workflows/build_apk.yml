name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CurrencyConverter-MMA-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Currency Converter by MMA - Release APK (v1.0.0)"
          body: |
            ### 📱 Currency Converter by MMA - Android APK
            
            Download and install `app-release.apk` directly on your Android phone to test the application.
            
            **Features:**
            - 40+ global currencies with real-time conversion.
            - 7D / 30D / 1Y interactive historical exchange trends.
            - Multi-currency portfolio watchlist.
            - Bank Fee & Spread simulation.
            - Target rate push alerts & custom rate override.
            - Clean Apple Titanium dark mode aesthetic.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
